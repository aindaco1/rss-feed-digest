name: Deploy Delivery Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker environment
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-delivery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy and verify private durable state
        env:
          DELIVERY_TARGET: ${{ inputs.target }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIGEST_STATE_TOKEN: ${{ secrets.DIGEST_STATE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.DIGEST_DISPATCH_TOKEN }}
        run: node scripts/deploy-delivery.js
